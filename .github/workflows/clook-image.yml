# Build the linux/arm64 image for the clook k3s cluster (fork-only workflow).
#
# Upstream publishes no container image. Run it by hand (Actions tab or
# `gh workflow run clook-image.yml -f ref=<commit|tag>`): it builds the
# upstream Dockerfile at `ref` and pushes
#   ghcr.io/clook/resonance-server:<version>-<short sha>

name: Build image (clook)

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Commit, tag or branch to build
                required: true
                default: main

permissions:
    contents: read
    packages: write

jobs:
    image:
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - name: Compute tag
              id: tag
              run: |
                  version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)
                  echo "tag=${version}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/arm64
                  push: true
                  tags: ghcr.io/clook/resonance-server:${{ steps.tag.outputs.tag }}
                  labels: org.opencontainers.image.source=https://github.com/clook/resonance-server
